services:
  # ️ MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: mosco-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "mosco_production_password_2026"
      MYSQL_DATABASE: "mosco_db"
    ports:
      # Chuyển cổng Host sang 3307 để tránh đụng độ với MySQL Service gốc của Windows
      - "3307:3306"
    volumes:
      - mosco_mysql_data:/var/lib/mysql

  #  Spring Boot Backend Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mosco-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=mosco_db
      - DB_USER=root
      - DB_PASS=mosco_production_password_2026
    depends_on:
      - mysql

  #  Python AI RAG Sidecar Service
  rag_sidecar:
    build:
      context: ./tools/rag_sidecar
      dockerfile: Dockerfile
    container_name: mosco-rag-sidecar
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PYTHONUNBUFFERED=1

#  Khai báo Volume để lưu dữ liệu CSDL vĩnh viễn trên Host
volumes:
  mosco_mysql_data:
