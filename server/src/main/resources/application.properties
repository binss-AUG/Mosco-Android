server.port=8080

# ── MySQL Configuration ──────────────────────────────────
# Values read from .env file via spring-dotenv, with inline defaults
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mosco_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# ── HikariCP Connection Pool ────────────────────────────
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MoscoHikariPool

# ── H2 Console (disabled in MySQL mode) ─────────────────
spring.h2.console.enabled=false

# ── JWT Configuration ────────────────────────────────────
jwt.secret=${JWT_SECRET:mosco-jwt-secret-key-2026-production-grade}
jwt.expiration=${JWT_EXPIRATION:86400000}
