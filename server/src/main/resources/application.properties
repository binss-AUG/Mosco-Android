server.port=8080

# ── MySQL Configuration ──────────────────────────────────
# Values read from .env file via spring-dotenv, with inline defaults
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mosco_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:31072006}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# ── HikariCP Connection Pool ────────────────────────────
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MoscoHikariPool

# ── H2 Console (disabled in MySQL mode) ─────────────────
spring.h2.console.enabled=false

# ── JWT Configuration ────────────────────────────────────
jwt.secret=${JWT_SECRET:mosco-jwt-secret-key-2026-production-grade}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Mail Configuration (Gmail) ───────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:liminhthuyen@gmail.com}
spring.mail.display-name=${MAIL_FROM_NAME:Mosco Galactic Support}
spring.mail.password=${MAIL_PASS:wqwz cmcb vopw wlfs}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=10000


# ── JPA/Hibernate Batch Configuration ────────────────────
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.show-sql=false

# -- Redis Configuration ----------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000

# -- Compression Configuration ----------------------------
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# -- File Upload Configuration ----------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
