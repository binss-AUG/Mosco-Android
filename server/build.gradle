plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.vn.jet.mosco'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// Database Drivers
	runtimeOnly 'com.h2database:h2'                         // Dev/Test fallback
	runtimeOnly 'com.mysql:mysql-connector-j:8.3.0'         // Production MySQL

	// JWT Authentication (io.jsonwebtoken/jjwt)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	// .env file support
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'

	// Thư viện hỗ trợ logic SpinSystem
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'com.google.code.gson:gson:2.10.1'
	implementation 'com.squareup.okhttp3:okhttp:4.12.0'


	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'



	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
}

bootRun {
	jvmArgs = ["-Xmx1024m", "-Xms512m"]
}

tasks.named('test') {
	useJUnitPlatform()
}
