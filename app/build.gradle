plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.vn.jet.mosco'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.vn.jet.mosco"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // --- Các thư viện cơ bản ---
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // --- Firebase (Dùng cho Auth và lưu trữ kho đồ Online) ---
    // Import cái BOM này để không cần quản lý version từng cái lẻ
    implementation platform('com.google.firebase:firebase-bom:32.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // --- Room Database (Lưu 9000 thẻ Offline cho mượt) ---
    def room_version = "2.5.2"
    implementation "androidx.room:room-runtime:$room_version"
    // Quan trọng: Dùng annotationProcessor thay cho kapt vì mình dùng Java
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // --- Retrofit & Gson (Tải dữ liệu từ GitHub Gist) ---
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // --- Glide (Hiển thị ảnh thẻ bài từ link imagedelivery) ---
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
}